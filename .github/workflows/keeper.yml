name: Market-day keeper

# GitHub's own schedule is unreliable at busy times (on 14 Oct 2026 the 09:05, 10:00, 11:30 and 13:00 IST runs never
# started, and others ran up to 2 hours late). This job starts before the open, stays up through the session and
# starts the "Intraday nowcast" workflow at fixed IST times. The nowcast's own cron entries remain as a fallback and
# skip themselves when a run has just happened.
# 13-19 Oct 2026: every scheduled run of this repo started 2-5 hours late (the 08:37 keeper at 13:34), so the crons
# below cannot be relied on to start the day. A scheduled task outside GitHub dispatches this workflow at 08:22 IST
# on trading days; the crons stay as a last resort (a late keeper still catches up the most recent update).
on:
  schedule:
    - cron: "7 3 * * 1-5"      # 08:37 IST
    - cron: "19 3 * * 1-5"     # 08:49 IST (backup start; exits if a keeper is already running)
  workflow_dispatch:
    inputs:
      handoff:
        description: "Started by a keeper reaching its time limit (skips the one-keeper check)"
        required: false
        default: ""

permissions:
  actions: write               # start the nowcast workflow
  contents: read

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355       # GitHub's limit is 6 hours; the last update is at 14:50 IST, then the post-close forecast at 15:50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install exchange_calendars
      - name: Only one keeper, only on NSE trading days
        id: go
        run: |
          if [ -n "${{ github.event.inputs.handoff }}" ]; then sleep 60; fi    # let the previous keeper exit first
          others=$(gh run list --workflow keeper.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          day=$(PYTHONPATH=scripts python -c "from datetime import datetime; from zoneinfo import ZoneInfo; from calendars import is_session; print(int(is_session(datetime.now(ZoneInfo('Asia/Kolkata')).date(), 'XBOM')))")
          echo "other keepers running: $others, trading day: $day"
          if [ "$others" = "0" ] && [ "$day" = "1" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Start the nowcast at each update time
        if: steps.go.outputs.ok == 'true'
        env:
          HANDOFF: ${{ github.event.inputs.handoff }}
        run: python -u scripts/keeper.py
