name: Model experiments

# Backtest LightGBM variants side by side (scripts/experiment.py). Nothing is deployed or saved; read the job logs.
on:
  push:
    branches: [model-experiments]   # TEMPORARY: run on the PR branch
  workflow_dispatch:
    inputs:
      test_days:
        description: "Trading days to test (most recent)"
        required: false
        default: "750"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: [nifty, gold, silver, crude]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas yfinance lightgbm
      - env:
          PYTHONPATH: scripts
        run: python -u scripts/experiment.py ${{ matrix.key }} ${{ github.event.inputs.test_days || 750 }} 2
