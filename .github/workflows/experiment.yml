name: Model experiments

# TEMPORARY (test branch only): checks which newer action versions exist. Steps never run (if: false); a missing
# version fails at "Set up job" when GitHub resolves the action.
on:
  workflow_dispatch:
    inputs:
      test_days:
        required: false
        default: "0"
      mode:
        required: false
        default: "x"

permissions:
  contents: read

jobs:
  v0:
    name: "actions/checkout@v5"
    runs-on: ubuntu-latest
    steps:
      - if: ${{ false }}
        uses: actions/checkout@v5
      - run: echo resolved actions/checkout@v5
  v1:
    name: "actions/checkout@v6"
    runs-on: ubuntu-latest
    steps:
      - if: ${{ false }}
        uses: actions/checkout@v6
      - run: echo resolved actions/checkout@v6
