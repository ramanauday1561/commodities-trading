name: Model experiments

# Backtest LightGBM variants side by side (scripts/experiment.py). Nothing is deployed or saved; read the job logs.
on:
  workflow_dispatch:
    inputs:
      test_days:
        description: "Trading days to test (most recent)"
        required: false
        default: "750"
      mode:
        description: "variants (expected close), risk, events, calendar, resultsrisk, dailyfill, commodity (gold/silver/crude); NIFTY studies: accuracy, improve, extreme, strategy, preopen, results, earnings, open, vix, history, longsignal, intrarules, nextcandle, minute, options, shortopt, movesize, movesizekite, futures, leanfilters (see STUDIES.md); nextreplay (one day's next-candle leans replayed, test_days = the date); intradata (update the 5-minute history), dukafetch (the hourly overnight history) or optdata (NIFTY option prices); kitecheck (are the Kite secrets accepted), kitecompare (Kite vs Yahoo), kiteoptions (live option prices once), kiterepair (Kite's 5-minute candles in place of Yahoo's since 19 May 2026), kitepositions (can positions be read; counts only), kitefutures (NIFTY futures history from Kite), kitepaper (the paper straddle from saved option candles)"
        required: false
        default: "variants"

permissions:
  contents: write              # "intradata", "dukafetch" and "optdata" save history to their branches

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: [nifty, gold, silver, crude]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install numpy pandas yfinance lightgbm exchange_calendars
      - name: Kite Connect check (mode "kitecheck"; the KITE_API_KEY / KITE_API_SECRET secrets, no login needed)
        if: github.event.inputs.mode == 'kitecheck' && matrix.key == 'nifty'
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
        run: python -u scripts/kite.py check
      - name: Kite vs Yahoo (mode "kitecompare"; needs today's Kite login)
        if: github.event.inputs.mode == 'kitecompare' && matrix.key == 'nifty'
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_DIR: kite
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          pip install -q cryptography
          bash scripts/store.sh pull kite-session kite
          python -u scripts/kite_compare.py
      - name: Repair the 5-minute history with Kite (mode "kiterepair"; today's login; test_days = the first day, 750 = 19 May 2026)
        if: github.event.inputs.mode == 'kiterepair' && matrix.key == 'nifty'
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_DIR: kite
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          pip install -q cryptography
          bash scripts/store.sh pull kite-session kite
          bash scripts/store.sh pull intraday-data intra
          # a copy of the Yahoo-era history, once, before anything is replaced
          if ! git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" intraday-data-yahoo-backup >/dev/null; then
            bash scripts/store.sh push intraday-data-yahoo-backup intra --squash
          fi
          since="${{ github.event.inputs.test_days }}"; if [ "$since" = "750" ] || [ -z "$since" ]; then since=2026-05-19; fi
          python -u scripts/intraday_data.py repair intra "$since"
          bash scripts/store.sh push intraday-data intra
      - name: Live option prices once, not saved (mode "kiteoptions"; needs today's Kite login)
        if: github.event.inputs.mode == 'kiteoptions' && matrix.key == 'nifty'
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_DIR: kite
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          pip install -q cryptography
          bash scripts/store.sh pull kite-session kite
          mkdir -p optlive docs/data
          python -u scripts/options_live.py snap optlive docs/data
          cat docs/data/options-live.json || true
          head -5 optlive/snapshots/*.csv || true
      - name: Can the app read your Kite positions? (mode "kitepositions"; prints counts only, never positions)
        if: github.event.inputs.mode == 'kitepositions' && matrix.key == 'nifty'
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_DIR: kite
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          pip install -q cryptography
          bash scripts/store.sh pull kite-session kite
          python -c "import positions as p; x = p.fetch(); print('no Kite login' if x is None else f'positions read: {len(x)} rows, {len(p.tracked(x))} open NIFTY / BANKNIFTY options')"
      - name: NIFTY futures, 5-minute, continuous across expiries, from Kite (mode "kitefutures"; today's login; futures-data branch)
        if: github.event.inputs.mode == 'kitefutures' && matrix.key == 'nifty'
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_DIR: kite
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          pip install -q cryptography
          bash scripts/store.sh pull kite-session kite
          bash scripts/store.sh pull futures-data fut
          python -u scripts/futures_data.py update fut
          bash scripts/store.sh push futures-data fut
      - name: NIFTY futures for mode "futures" (the futures-data branch)
        if: github.event.inputs.mode == 'futures' && matrix.key == 'nifty'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/store.sh pull futures-data fut
      - name: The paper straddle from saved option candles (mode "kitepaper"; today's login; options-live branch)
        if: github.event.inputs.mode == 'kitepaper' && matrix.key == 'nifty'
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_DIR: kite
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          pip install -q cryptography
          bash scripts/store.sh pull kite-session kite
          bash scripts/store.sh pull options-live optlive
          python -u scripts/options_live.py backfill optlive
          bash scripts/store.sh push options-live optlive
      - name: 5-minute candle history (modes "intradata", "intrarules", "history", "longsignal", "nextcandle", "minute", "options", "nextreplay"; intraday-data branch)
        if: contains(fromJSON('["intradata", "intrarules", "history", "longsignal", "nextcandle", "minute", "options", "shortopt", "movesize", "movesizekite", "nextreplay", "leanfilters"]'), github.event.inputs.mode) && matrix.key == 'nifty'
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/store.sh pull intraday-data intra
          python -u scripts/intraday_data.py update intra
          bash scripts/store.sh push intraday-data intra
      - name: Kite's saved option quotes for mode "leanfilters" (options-live branch; the real pricing of an option)
        if: github.event.inputs.mode == 'leanfilters' && matrix.key == 'nifty'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/store.sh pull options-live optlive
      - name: Overnight history for modes "longsignal" and "options" (the four overnight-* branches)
        if: (github.event.inputs.mode == 'longsignal' || github.event.inputs.mode == 'options' || github.event.inputs.mode == 'futures') && matrix.key == 'nifty'
        env:
          GH_TOKEN: ${{ github.token }}
        run: for k in es nq nikkei hangseng; do bash scripts/store.sh pull "overnight-$k" od; done
      - name: Hourly overnight history from Dukascopy (mode "dukafetch"; one market per matrix job, resumable)
        if: github.event.inputs.mode == 'dukafetch'
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
        run: |
          k=$(python -c "print({'nifty':'es','gold':'nq','silver':'nikkei','crude':'hangseng'}['${{ matrix.key }}'])")
          bash scripts/store.sh pull "overnight-$k" od
          python -u scripts/overnight_data.py "$k" od 48
          bash scripts/store.sh push "overnight-$k" od
      - name: NIFTY option prices from NSE's bhavcopy (mode "optdata"; a quarter of the months per matrix job, resumable)
        if: github.event.inputs.mode == 'optdata'
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
        run: |
          p=$(python -c "print({'nifty':0,'gold':1,'silver':2,'crude':3}['${{ matrix.key }}'])")
          bash scripts/store.sh pull "options-data-p$p" opt
          python -u scripts/option_data.py update opt 45 "$p" 4
          bash scripts/store.sh push "options-data-p$p" opt
      - name: Option prices for mode "options" (the four options-data-p* branches)
        if: (github.event.inputs.mode == 'options' || github.event.inputs.mode == 'shortopt') && matrix.key == 'nifty'
        env:
          GH_TOKEN: ${{ github.token }}
        run: for p in 0 1 2 3; do bash scripts/store.sh pull "options-data-p$p" "opt/p$p"; done
      - name: Replay a day's next-candle leans (mode "nextreplay"; test_days = the date YYYY-MM-DD, or leave 750 for the last session)
        if: github.event.inputs.mode == 'nextreplay' && matrix.key == 'nifty'
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/store.sh pull scoreboard store
          d="${{ github.event.inputs.test_days }}"; case "$d" in ????-??-??) ;; *) d=last ;; esac
          python -u scripts/nextcandle.py replay intra store "$d"
      - env:
          PYTHONPATH: scripts
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          INTRADAY_DIR: intra
          OPTIONS_DIRS: opt/p0,opt/p1,opt/p2,opt/p3
        if: github.event.inputs.mode != 'intradata' && github.event.inputs.mode != 'dukafetch' && github.event.inputs.mode != 'optdata' && github.event.inputs.mode != 'nextreplay' && github.event.inputs.mode != 'kitecheck' && github.event.inputs.mode != 'kitecompare' && github.event.inputs.mode != 'kiteoptions' && github.event.inputs.mode != 'kiterepair' && github.event.inputs.mode != 'kitepositions' && github.event.inputs.mode != 'kitefutures' && github.event.inputs.mode != 'kitepaper'
        run: python -u scripts/experiment.py ${{ matrix.key }} ${{ github.event.inputs.test_days || 750 }} 2 ${{ github.event.inputs.mode || 'variants' }}
