name: Model experiments

# TEMPORARY (test branch only): runs newer action versions to see which still target Node 20.
on:
  workflow_dispatch:
    inputs:
      test_days:
        required: false
        default: "0"
      mode:
        required: false
        default: "x"

jobs:
  low:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v5
        with:
          path: /tmp/probe-cache
          key: probe-low-${{ github.run_id }}
      - run: mkdir -p out site && echo '{"a":1}' > out/data-x.json && echo hi > site/index.html
      - uses: actions/upload-artifact@v5
        with:
          name: data-low
          path: out/data-x.json
      - uses: actions/download-artifact@v5
        with:
          pattern: data-low*
          path: got
          merge-multiple: true
      - run: ls -R got && cat got/data-x.json
      - uses: actions/configure-pages@v6
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: pages-low
  high:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: /tmp/probe-cache
          key: probe-high-${{ github.run_id }}
      - run: mkdir -p out site && echo '{"a":1}' > out/data-x.json && echo hi > site/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: data-high
          path: out/data-x.json
      - uses: actions/download-artifact@v7
        with:
          pattern: data-high*
          path: got
          merge-multiple: true
      - run: ls -R got && cat got/data-x.json
      - uses: actions/configure-pages@v6
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: pages-high
