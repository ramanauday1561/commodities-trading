name: Model experiments

# Backtest LightGBM variants side by side (scripts/experiment.py). Nothing is deployed or saved; read the job logs.
on:
  workflow_dispatch:
    inputs:
      test_days:
        description: "Trading days to test (most recent)"
        required: false
        default: "750"
      mode:
        description: "variants (expected close), risk, events, calendar, resultsrisk, dailyfill, commodity (gold/silver/crude); NIFTY studies: accuracy, improve, extreme, strategy, preopen, results, earnings, open, vix, history, longsignal, intrarules, nextcandle (see STUDIES.md); intradata (update the 5-minute history) or dukafetch (update the hourly overnight history)"
        required: false
        default: "variants"

permissions:
  contents: write              # "intradata" and "dukafetch" save candle history to their branches

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: [nifty, gold, silver, crude]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install numpy pandas yfinance lightgbm exchange_calendars
      - name: 5-minute candle history (modes "intradata", "intrarules", "history", "longsignal", "nextcandle"; intraday-data branch)
        if: contains(fromJSON('["intradata", "intrarules", "history", "longsignal", "nextcandle"]'), github.event.inputs.mode) && matrix.key == 'nifty'
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/store.sh pull intraday-data intra
          python -u scripts/intraday_data.py update intra
          bash scripts/store.sh push intraday-data intra
      - name: Overnight history for mode "longsignal" (the four overnight-* branches)
        if: github.event.inputs.mode == 'longsignal' && matrix.key == 'nifty'
        env:
          GH_TOKEN: ${{ github.token }}
        run: for k in es nq nikkei hangseng; do bash scripts/store.sh pull "overnight-$k" od; done
      - name: Hourly overnight history from Dukascopy (mode "dukafetch"; one market per matrix job, resumable)
        if: github.event.inputs.mode == 'dukafetch'
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
        run: |
          k=$(python -c "print({'nifty':'es','gold':'nq','silver':'nikkei','crude':'hangseng'}['${{ matrix.key }}'])")
          bash scripts/store.sh pull "overnight-$k" od
          python -u scripts/overnight_data.py "$k" od 48
          bash scripts/store.sh push "overnight-$k" od
      - env:
          PYTHONPATH: scripts
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          INTRADAY_DIR: intra
        if: github.event.inputs.mode != 'intradata' && github.event.inputs.mode != 'dukafetch'
        run: python -u scripts/experiment.py ${{ matrix.key }} ${{ github.event.inputs.test_days || 750 }} 2 ${{ github.event.inputs.mode || 'variants' }}
