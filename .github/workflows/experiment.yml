name: Model experiments

# Backtest LightGBM variants side by side (scripts/experiment.py). Nothing is deployed or saved; read the job logs.
on:
  workflow_dispatch:
    inputs:
      test_days:
        description: "Trading days to test (most recent)"
        required: false
        default: "750"
      mode:
        description: "variants (expected close), risk (big-move probability and ranges), accuracy (NIFTY direction study), improve (NIFTY: extra pre-open inputs, intraday patterns), commodity (futures: move so far vs settlement), extreme (NIFTY: extreme overnight days), strategy (NIFTY: trading rules after costs), open (NIFTY: from-open and 10:15 calls, expiry days), events (US CPI/jobs/Fed calendar) or dailyfill (candles rebuilt from 15m bars vs official)"
        required: false
        default: "variants"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: [nifty, gold, silver, crude]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install numpy pandas yfinance lightgbm exchange_calendars
      - env:
          PYTHONPATH: scripts
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u scripts/experiment.py ${{ matrix.key }} ${{ github.event.inputs.test_days || 750 }} 2 ${{ github.event.inputs.mode || 'variants' }}
