name: Grok test

# One short call to Grok with the XAI_API_KEY secret, to check the key works (scripts/grok.py test). The key is only
# read from the secret; the log shows "OK" and Grok's one-line answer, or why it failed (HTTP code only).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Ask Grok one question
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 scripts/grok.py test
