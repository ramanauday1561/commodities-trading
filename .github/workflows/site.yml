name: Publish the site

# 5 Nov 2026: a merge that changes only the pages (docs/, e.g. the Liquid Glass UI) started no run that publishes the
# site, so the phone kept the old pages until the next 10-minute run (08:53 at the earliest). This publishes docs/ with
# the latest data (site-data) whenever a merge changes a page; forecast and live runs still publish as before.
on:
  push:
    branches: [main]
    paths: ["docs/**", "!docs/index.html", ".github/workflows/site.yml"]   # index.html: predict.yml publishes it
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: The latest data the pages read
        run: bash scripts/store.sh pull site-data docs/data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_first.outputs.page_url }}
    steps:
      - id: deploy_first             # GitHub's Pages API sometimes fails for a moment; one retry a minute later
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy_first.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
