name: Status alert test

# Sends one test notification through ntfy.sh (NTFY_TOPIC) so alerts can be checked any time. Fails if no channel is set up or none delivered.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Text of the test alert"
        required: false
        default: "If you see this, alerts work."

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Send
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: python3 scripts/status.py test "$MESSAGE"
