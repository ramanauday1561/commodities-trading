name: Predict next candles

on:
  schedule:
    # GitHub sometimes skips or delays scheduled runs, so every slot has backups. The `gate` job drops the duplicates.
    - cron: "0 3 * * 1-5"      # 08:30 IST, before NSE opens -> forecasts start with today
    - cron: "20 3 * * 1-5"
    - cron: "40 3 * * 1-5"
    - cron: "15 10 * * 1-5"    # 15:45 IST, after NSE close
    - cron: "45 10 * * 1-5"
    - cron: "30 22 * * 1-5"    # 04:00 IST next day, after the US futures close
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      keys:
        description: "Comma-separated instrument keys to run (empty = all, and deploy), e.g. nifty,gold"
        required: false
        default: ""
      kronos_t:
        description: "Experiment: Kronos sampling temperature (default 0.6)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["scripts/**", "docs/index.html", ".github/workflows/predict.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # deploying runs share one queue; partial manual runs (experiments) get their own so they can run side by side
  group: pages-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.keys != '') && github.run_id || 'main' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            # GitHub starts this repo's scheduled runs 2-5 hours late (the 08:30 IST run started at 13:19 on 15 and
            # 16 Oct). During the session the keeper starts every update; a full forecast rebuild then only queues
            # ahead of the intraday updates (same publishing queue), so a run arriving then is skipped.
            hm=$(TZ=Asia/Kolkata date +%H%M)
            if [ "$hm" -ge 0900 ] && [ "$hm" -le 1540 ]; then
              echo "late scheduled run at $hm IST, during the session; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # another run on main already succeeded, or is running/queued, within the last 90 minutes -> this one is a duplicate
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/predict.yml/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.head_branch == "main")
                     | select(.status == "in_progress" or .status == "queued" or .conclusion == "success")
                     | select((now - (.created_at | fromdateiso8601)) < 5400)] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip"

  start-keeper:
    # GitHub skips scheduled runs at busy times (on 15 Oct 2026 every morning keeper/nowcast schedule was dropped), so
    # the morning forecast run - scheduled, or the page's Rerun button - also starts the market-day keeper. The keeper
    # itself exits on holidays and when one is already running.
    needs: gate
    if: ${{ needs.gate.outputs.skip != 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          hm=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$hm" -ge 0700 ] && [ "$hm" -le 1430 ]; then
            gh workflow run keeper.yml --repo "${{ github.repository }}" --ref main && echo "keeper started at $hm IST"
          else
            echo "outside market hours ($hm IST); keeper not started"
          fi

  setup:
    needs: gate
    if: ${{ needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.m.outputs.keys }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        env:
          ONLY: ${{ github.event.inputs.keys }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          keys = [i['key'] for i in json.load(open('scripts/instruments.json'))]
          only = [k.strip() for k in os.environ.get('ONLY', '').split(',') if k.strip()]
          print('keys=' + json.dumps([k for k in keys if k in only] if only else keys))
          PY

  predict:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJson(needs.setup.outputs.keys) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt
      - name: Get Kronos
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-base
      - name: Stored news-tone history and futures rolls (read only; the deploy job saves new rows)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/store.sh pull scoreboard store
      - name: Run prediction
        env:
          KRONOS_T: ${{ github.event.inputs.kronos_t }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}      # optional: US CPI / jobs release dates (us_events.py)
        run: mkdir -p docs/data && python scripts/predict.py ${{ matrix.key }}
      - uses: actions/upload-artifact@v7
        with:
          name: data-${{ matrix.key }}
          path: docs/data/${{ matrix.key }}.json

  deploy:
    needs: [gate, predict]
    # deploy whatever succeeded, even if one instrument failed; never deploy a partial manual run
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' && github.event.inputs.keys == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Last published data (fallback for any instrument that failed this time)
        run: bash scripts/store.sh pull site-data docs/data
      - uses: actions/download-artifact@v7
        with:
          pattern: data-*
          path: docs/data
          merge-multiple: true
      - name: Drop data of instruments that were removed from instruments.json
        run: python scripts/prune_data.py docs/data
      - name: Live scoreboard (record forecasts, score the ones whose day has finished)
        run: |
          bash scripts/store.sh pull scoreboard store
          python scripts/scoreboard.py store docs/data
          python scripts/newsfeat.py merge docs/data store
          python scripts/rolls.py merge docs/data store
      - name: Today's call for NIFTY (pre-open and intraday direction calls)
        continue-on-error: true
        timeout-minutes: 8
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}       # US CPI / jobs dates: the signal stands aside after them
        run: |
          pip install pandas yfinance exchange_calendars
          python -u scripts/todaycall.py store docs/data
          python -u scripts/gift_record.py store docs/data || true      # GIFT Nifty snapshot, history for a later test
      - name: 5-minute candle history (NIFTY 50, Bank NIFTY, India VIX; for intraday backtests, not shown on the site)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          pip install -q pandas yfinance requests
          bash scripts/store.sh pull intraday-data intra
          python -u scripts/intraday_data.py update intra
          bash scripts/store.sh push intraday-data intra
          PYTHONPATH=scripts python -u scripts/daylike.py intra docs/data     # "days like today" table for the session
          pip install -q lightgbm && PYTHONPATH=scripts python -u scripts/nextcandle.py train intra docs/data   # next-candle lean (info)
      - name: Status page, phone alert and the day's scorecard
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ github.ref == 'refs/heads/main' && secrets.NTFY_TOPIC || '' }}
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_CHAT_ID || '' }}
          XAI_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.XAI_API_KEY || '' }}
          PYTHONPATH: scripts
        run: |                       # after the close: the live chart's scorecard and Grok's why, then the summary
          python -u scripts/live.py docs/data store close || true
          python -u scripts/status.py docs/data store         # journal saved with the scoreboard below
      - name: NIFTY option prices (NSE bhavcopy of the latest sessions, option_data.py) and each day on real premiums
        continue-on-error: true
        timeout-minutes: 8
        env:
          PYTHONPATH: scripts
        run: |                       # NSE publishes the day's file in the evening: the 04:00 IST run adds it
          pip install -q requests exchange_calendars
          for p in 0 1 2 3; do bash scripts/store.sh pull "options-data-p$p" "opt/p$p"; done
          for p in $(python scripts/option_data.py parts); do
            python -u scripts/option_data.py update "opt/p$p" 3 "$p" 4 && bash scripts/store.sh push "options-data-p$p" "opt/p$p"
          done
          python -u scripts/option_record.py store docs/data opt/p0,opt/p1,opt/p2,opt/p3
      - name: The week's summary to the phone (Saturday or Sunday, once a week; weekly.py)
        continue-on-error: true
        timeout-minutes: 4
        env:
          NTFY_TOPIC: ${{ github.ref == 'refs/heads/main' && secrets.NTFY_TOPIC || '' }}
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_CHAT_ID || '' }}
          PYTHONPATH: scripts
        run: python -u scripts/weekly.py docs/data store
      - name: News (GDELT headlines; history kept for later evaluation, not a model input)
        continue-on-error: true
        timeout-minutes: 4
        run: python -u scripts/news.py docs/data store
      - name: Hourly candles for the chart (display only)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip install -q pandas yfinance
          python -u scripts/hourly.py docs/data
      - run: python3 scripts/build_manifest.py
      - name: Save scoreboard and latest data (used by the intraday workflow)
        continue-on-error: true
        run: |
          bash scripts/store.sh push scoreboard store
          mkdir -p site-snap && cp docs/data/*.json site-snap/ && rm -f site-snap/intraday-*.json
          cp docs/data/nextcandle-model.txt site-snap/ 2>/dev/null || true    # the next-candle model (nextcandle.py)
          # day replays (replay.py) may have been added while this job ran: keep them in the squashed copy
          latest="$RUNNER_TEMP/site-latest" && bash scripts/store.sh pull site-data "$latest" && cp "$latest"/replay-*.json site-snap/ 2>/dev/null || true
          bash scripts/store.sh push site-data site-snap --squash
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy_first             # GitHub's Pages API sometimes fails for a moment (14 Oct 2026: "Fetching artifact
        continue-on-error: true       # metadata failed"); one retry a minute later, on the older proven v4
        uses: actions/deploy-pages@v5
      - if: steps.deploy_first.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
