name: Predict next candles

on:
  schedule:
    - cron: "15 3 * * 1-5"    # 08:45 IST, before NSE opens -> forecasts start with today
    - cron: "15 10 * * 1-5"   # 15:45 IST, after NSE close
    - cron: "30 22 * * 1-5"   # 04:00 IST (next day), after the US futures close
  workflow_dispatch:
    inputs:
      keys:
        description: "Comma-separated instrument keys to run (empty = all), e.g. nifty,gold"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["scripts/**", "docs/index.html", ".github/workflows/predict.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.m.outputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ONLY: ${{ github.event.inputs.keys }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          keys = [i['key'] for i in json.load(open('scripts/instruments.json'))]
          only = [k.strip() for k in os.environ.get('ONLY', '').split(',') if k.strip()]
          print('keys=' + json.dumps([k for k in keys if k in only] if only else keys))
          PY

  predict:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJson(needs.setup.outputs.keys) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt
      - name: Get Kronos
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-base
      - name: Run prediction
        run: mkdir -p docs/data && python scripts/predict.py ${{ matrix.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.key }}
          path: docs/data/${{ matrix.key }}.json

  deploy:
    needs: predict
    # deploy whatever succeeded, even if one instrument failed; never deploy a partial manual run
    if: ${{ !cancelled() && github.event.inputs.keys == '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: docs/data
          merge-multiple: true
      - run: python3 scripts/build_manifest.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
