name: Intraday nowcast

# During the NSE session: predict today's close from the 15-minute candles so far and republish the site
# (the latest full forecasts are read from the `site-data` branch written by the main workflow).
on:
  schedule:                    # fallback only: keeper.yml starts this at fixed times; these skip if a run just happened
    - cron: "23 3 * * 1-5"     # 08:53 IST: pre-open "Today's call" (recorded only if made before the 09:15 open)
    - cron: "51 4 * * 1-5"     # 10:21 IST
    - cron: "41 6 * * 1-5"     # 12:11 IST
    - cron: "51 7 * * 1-5"     # 13:21 IST
    - cron: "37 8 * * 1-5"     # 14:07 IST
  workflow_dispatch:

permissions:
  actions: read                # the fallback check looks at recent runs
  contents: write                # the live record of "Today's call" is saved to the scoreboard branch
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.have.outputs.ok }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fallback run? Skip if the keeper (or anyone) ran this in the last 25 minutes
        id: gate
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # GitHub starts this repo's scheduled runs 2-5 hours late (13-19 Oct 2026: the 08:53 run started at 13:49,
            # the 14:07 one at 18:58). A run that arrives outside the session has nothing to update.
            hm=$(TZ=Asia/Kolkata date +%H%M)
            if [ "$hm" -lt 0840 ] || [ "$hm" -gt 1535 ]; then echo "late scheduled run at $hm IST, outside the session; skipping"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            since=$(date -u -d '25 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            recent=$(gh api "repos/${{ github.repository }}/actions/workflows/intraday.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .created_at >= \"$since\" and (.conclusion == \"success\" or .status != \"completed\"))] | length" || echo 0)
            if [ "$recent" != "0" ]; then go=false; echo "a run happened in the last 25 minutes; skipping"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v6
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - if: steps.gate.outputs.go == 'true'
        run: pip install yfinance pandas numpy exchange_calendars
      - name: Latest published data
        if: steps.gate.outputs.go == 'true'
        run: bash scripts/store.sh pull site-data docs/data
      - name: Nowcast
        if: steps.gate.outputs.go == 'true'
        run: python scripts/intraday.py nifty
      - name: Today's call (pre-open and intraday direction calls, live record)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}       # US CPI / jobs dates: the signal stands aside after them
        run: |
          bash scripts/store.sh pull scoreboard store
          python -u scripts/todaycall.py store docs/data
          python -u scripts/gift_record.py store docs/data || true      # GIFT Nifty snapshot, history for a later test
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then bash scripts/store.sh push scoreboard store; fi
      - name: Refresh news headlines (history is only recorded by the daily run)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: python -u scripts/news.py docs/data "$RUNNER_TEMP/news-store"
      - name: Status page, phone alerts and the live chart (Grok notes are information only)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ github.ref == 'refs/heads/main' && secrets.NTFY_TOPIC || '' }}
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_CHAT_ID || '' }}
          XAI_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.XAI_API_KEY || '' }}
          PYTHONPATH: scripts
        run: |
          bash scripts/store.sh pull scoreboard store
          before=$(jq -r '"\(.date)\(.state)\(.kind)"' docs/data/status.json 2>/dev/null || echo none)
          python -u scripts/live.py docs/data store morning || true
          python -u scripts/status.py docs/data store
          python -u scripts/live.py docs/data store run || true
          after=$(jq -r '"\(.date)\(.state)\(.kind)"' docs/data/status.json 2>/dev/null || echo none)
          if [ "$before" != "$after" ]; then echo 1 > "$RUNNER_TEMP/status_changed"; fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then bash scripts/store.sh push scoreboard store; fi
      - name: Hourly NIFTY candles for the chart
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: python -u scripts/hourly.py docs/data nifty
      - name: Save the latest call, nowcast and headlines to site-data (so every reader sees what the page shows)
        if: steps.gate.outputs.go == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          snap="$RUNNER_TEMP/site-data" && bash scripts/store.sh pull site-data "$snap"
          cp docs/data/today-nifty.json docs/data/intraday-nifty.json docs/data/hourly-nifty.json docs/data/status.json docs/data/status-today.json docs/data/live-nifty.json docs/data/gift-nifty.json docs/data/news-*.json "$snap"/ 2>/dev/null || true
          bash scripts/store.sh push site-data "$snap"
      - id: have                    # runs come every 10 minutes; the site is republished about every 30 (at the :05 and
        if: steps.gate.outputs.go == 'true'   # :35 runs), before the open, after the close and whenever the Status
        run: |                        # page changes. The live chart and Status page read site-data, fresh every run.
          hm=$(TZ=Asia/Kolkata date +%H%M); m=$((10#${hm:2:2}))
          changed=$(cat "$RUNNER_TEMP/status_changed" 2>/dev/null || echo 0)
          if [ -f docs/data/index.json ] && { [ $((m % 30)) -lt 10 ] || [ "$hm" -lt 0920 ] || [ "$hm" -ge 1530 ] || [ "$changed" = 1 ] || [ "${{ github.event_name }}" = "schedule" ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "not republishing the site this run (site-data is updated)"
          fi
      - if: steps.have.outputs.ok == 'true'
        uses: actions/configure-pages@v6
      - if: steps.have.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publish:
    needs: nowcast
    if: ${{ needs.nowcast.outputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_first.outputs.page_url }}
    steps:
      - id: deploy_first             # GitHub's Pages API sometimes fails for a moment (14 Oct 2026: "Fetching artifact
        continue-on-error: true       # metadata failed"); one retry a minute later, on the older proven v4
        uses: actions/deploy-pages@v5
      - if: steps.deploy_first.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
