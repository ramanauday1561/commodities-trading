name: News history backfill

# One-off (re-runnable) job: fetch past headlines per session from Google News so the news-tone input can be tested
# on about a year of history straight away. Resumable: sessions already stored are skipped.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days to go back"
        required: false
        default: "365"

permissions:
  contents: write

concurrency:
  group: news-backfill
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        key: [nifty, gold, silver, crude]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas yfinance exchange_calendars
      - name: Stored history
        run: bash scripts/store.sh pull scoreboard store
      - name: Fetch missing sessions
        run: python -u scripts/newsfeat.py backfill ${{ matrix.key }} store ${{ github.event.inputs.days || 365 }} 2400
      - name: Walk-forward test of the tone against real returns
        run: |
          python - <<'PY'
          import json, sys, yfinance as yf
          sys.path.insert(0, "scripts")
          import newsfeat
          key = "${{ matrix.key }}"
          inst = next(i for i in json.load(open("scripts/instruments.json")) if i["key"] == key)
          px = yf.download(inst["ticker"], period="2y", interval="1d", auto_adjust=False, progress=False)
          px.columns = [c[0] if isinstance(c, tuple) else c for c in px.columns]
          closes = {d.strftime("%Y-%m-%d"): float(c) for d, c in px["Close"].dropna().items()}
          print(key, json.dumps(newsfeat.evaluate(newsfeat.load_rows(newsfeat.history_path("store", key)), closes)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: news-${{ matrix.key }}
          path: store/news-daily/${{ matrix.key }}.json

  save:
    needs: fetch
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: news-*
          path: fetched
          merge-multiple: true
      - name: Merge into the scoreboard branch
        run: |
          bash scripts/store.sh pull scoreboard store
          mkdir -p store/news-daily
          python3 - <<'PY'
          import glob, json, os, sys
          sys.path.insert(0, "scripts")
          from newsfeat import load_rows, merge_rows
          for f in glob.glob("fetched/*.json"):
              dst = os.path.join("store/news-daily", os.path.basename(f))
              rows = merge_rows(load_rows(dst), load_rows(f))
              json.dump(rows, open(dst, "w"), separators=(",", ":"))
              print(dst, len(rows))
          PY
          bash scripts/store.sh push scoreboard store
