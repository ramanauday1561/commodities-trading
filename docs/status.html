<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status</title>
<meta name="theme-color" content="#EDC9AF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Status">
<style>
  :root { --bg:#EDC9AF; --text:#2B2F14; --muted:#57532F; --up:#185C3B; --down:#A3261F; --warn:#7A4E00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         /* clear the iPhone status bar and the blur iOS draws under it when the page scrolls */
         padding:calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 24px); text-align:center; }
  h1 { font-size:14px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  #word { font-size:clamp(72px, 28vw, 168px); font-weight:800; line-height:1; letter-spacing:-.02em; margin:8px 0 16px; }
  #word.CALL { color:var(--up); } #word.PUT { color:var(--down); } #word.STAY { color:var(--warn); } #word.SELL { color:#24529C; }
  #word.NOTHING { color:var(--muted); font-size:clamp(56px, 20vw, 120px); }
  #headline { font-size:20px; font-weight:600; margin:0 0 8px; }
  #reason { color:var(--muted); max-width:34ch; margin:0 auto; }
  #next { color:var(--text); font-size:14px; max-width:34ch; margin:12px auto 0; padding:8px 12px; border-radius:12px;
          background:rgba(75,83,32,0.08); border:1px solid rgba(75,83,32,.25); }
  #next b { color:var(--muted); font-weight:500; margin-right:4px; }
  #optnote { color:var(--muted); font-size:13px; max-width:36ch; margin:12px auto 0; padding-top:10px; border-top:1px solid rgba(75,83,32,.25); }
  #meta { color:var(--muted); font-size:13px; margin-top:24px; }
  #feed { color:var(--muted); font-size:13px; margin:6px auto 0; max-width:36ch; } #feed .bad { color:var(--warn); }
  .box { margin:20px auto 0; max-width:360px; width:100%; border:1px solid rgba(75,83,32,.25); border-radius:12px; padding:12px 16px; text-align:left; }
  .box div { display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
  .box span { color:var(--muted); }
  #warn { display:none; margin:20px auto 0; max-width:360px; background:#F6D9D3; border:1px solid var(--down); border-radius:12px; padding:12px 16px; }
  #today { margin:24px auto 0; max-width:360px; width:100%; text-align:left; font-size:14px; }
  #today h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  #today li { display:flex; gap:10px; padding:4px 0; border-top:1px solid rgba(75,83,32,.15); }
  #today ol { list-style:none; margin:0; padding:0; }
  #today b { min-width:64px; } #today time { color:var(--muted); min-width:42px; }
  .up { color:var(--up); } .down { color:var(--down); }
  a { color:var(--muted); }
  /* Why NOTHING (3 Nov 2026): what the 09:15 signal's lean did on every day, traded or not */
  #why { margin:24px auto 0; max-width:360px; width:100%; text-align:left; font-size:14px; }
  #why h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  #why p { margin:6px 0; color:var(--muted); } #why p b { color:var(--text); font-weight:600; }
  #why table { width:100%; border-collapse:collapse; margin-top:6px; font-size:13px; font-variant-numeric:tabular-nums; }
  #why td { padding:4px 0; border-top:1px solid rgba(75,83,32,.15); } #why td.n { text-align:right; }
  #why td.m { color:var(--muted); }
</style>
<script src="fresh.js"></script>
</head>
<body>
  <h1 data-nav>NIFTY · Status</h1>
  <div id="word" class="NOTHING">…</div>
  <p id="headline"></p>
  <p id="reason"></p>
  <p id="next" hidden data-glass></p>
  <p id="optnote" hidden></p>
  <div id="warn"></div>
  <div id="trade" class="box" hidden></div>
  <p id="meta"></p>
  <p id="feed" hidden></p>
  <section id="today" hidden data-glass><h2>Today</h2><ol id="rows"></ol></section>
  <section id="why" hidden data-glass></section>
  <p style="font-size:13px; margin-top:28px"><a href="live.html" style="padding:14px 0">Live chart</a> · <a href="./#nifty" style="padding:14px 0">Full forecast</a> · <a href="history.html" style="padding:14px 0">History</a> · Learning tool, not financial advice.</p>
<script>
const WORD = { CALL: 'CALL', PUT: 'PUT', STAY: 'STAY', SELL: 'SELL', NOTHING: 'NOTHING' };   // the only five states
const $ = id => document.getElementById(id);
// What happens next, in one line (2 Nov 2026)
function nextStep(s) {
  const day = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
  const ist = new Date(Date.now() + 19800000), hm = ist.getUTCHours() * 100 + ist.getUTCMinutes();
  switch (s.kind) {
    case 'pending': return "Today's signal comes at about 08:57 IST, with an alert either way.";
    case 'call': case 'put': return `Buy the ${s.side} at the 09:15 open; a SELL alert follows at about 14:50, or at the stop.`;
    case 'hold': return 'Hold. A SELL alert comes at about 14:50, or at once if NIFTY reaches the stop.';
    case 'sell': case 'stop': return 'Square off now. No new trade today.';
    case 'no_trade': return hm < 1530 ? `Nothing to do today. Next signal: ${day(s.next_session) || 'the next session'}, about 08:57.` : '';
    default: return s.next_session ? `Next session ${day(s.next_session)}; the signal comes at about 08:57.` : '';
  }
}
async function load() {
  try {
    const r = await fresh('status.json');
    if (!r.ok) throw new Error('no status yet');
    const s = await r.json();
    const todayIst = new Date(Date.now() + 19800000).toISOString().slice(0, 10);
    const stale = s.date !== todayIst;
    const state = stale || !WORD[s.state] ? 'NOTHING' : s.state;
    $('word').className = state;
    $('word').textContent = WORD[state];
    $('headline').textContent = stale ? 'Waiting for today’s update' : s.headline;
    $('reason').textContent = stale ? 'The signal is made at about 08:57 IST on market days.' : s.reason;
    const nx = stale ? '' : nextStep(s);
    $('next').hidden = !nx; $('next').innerHTML = nx ? `<b>Next:</b>${nx}` : '';
    $('optnote').hidden = stale || !s.option_note;                 // which option, or what buying without a reason costs
    $('optnote').textContent = stale ? '' : (s.option_note || '');
    const t = x => new Date(x).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const istNow = new Date(Date.now() + 19800000), hmNow = istNow.getUTCHours() * 100 + istNow.getUTCMinutes();
    const open = !stale && hmNow >= 845 && hmNow < 1535 && s.kind !== 'closed';
    $('meta').innerHTML = `Updated ${t(s.updated)} ${freshTag(s.updated, open)}${s.since && !stale ? ' · this signal since ' + t(s.since) : ''}`;
    document.title = stale ? 'Status' : `Status: ${WORD[state]}`;
    // 09:15-15:30 IST on a trading day (next_session, from the last update) with no call for today: something failed
    const ist = new Date(Date.now() + 19800000), hm = ist.getUTCHours() * 100 + ist.getUTCMinutes();
    const broken = hm >= 915 && hm < 1530 && ((stale && s.next_session === todayIst) || (!stale && s.kind === 'pending'));
    $('warn').style.display = broken ? 'block' : 'none';
    $('warn').textContent = 'No signal today: the 08:57 call did not arrive. If the market is open, do not trade on the app today.';
    const t2 = !stale && s.trade;
    $('trade').hidden = !t2;
    if (t2) {
      const f = x => x.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const cls = t2.pct >= 0 ? 'up' : 'down';
      $('trade').innerHTML = `<div><span>${t2.side} bought at the open</span><b>${f(t2.entry)}</b></div>
        <div><span>Stop (sell if NIFTY goes ${t2.side === 'CALL' ? 'below' : 'above'})</span><b>${f(t2.stop)}</b></div>
        <div><span>NIFTY now</span><b>${f(t2.price)}</b></div>
        <div><span>Trade so far (NIFTY move)</span><b class="${cls}">${t2.pct >= 0 ? '+' : ''}${t2.pct.toFixed(2)}%</b></div>`;
    }
    whyNothing(s.shadow);
    feedLine(stale ? null : s.kite);
    loadToday(stale ? null : s.date);
  } catch (e) {
    $('word').className = 'NOTHING'; $('word').textContent = 'NOTHING';
    $('headline').textContent = 'No status yet'; $('reason').textContent = String(e.message || e);
  }
}
// Where today's prices come from (4 Nov 2026): Kite after the morning login, else Yahoo; plus any data check that
// failed this session (prices.py writes data-health.json)
async function feedLine(k) {
  const el = $('feed');
  if (!k) { el.hidden = true; return; }
  const t = x => new Date(x).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' });
  let html = k.logged_in ? `Prices: Kite (logged in until ${t(k.until)} IST)`
                         : `Prices: Yahoo · <a href="kite.html">log in to Kite</a> for Kite's own candles`;
  try {
    const h = await siteJSON('data-health.json');
    const today = new Date(Date.now() + 19800000).toISOString().slice(0, 10);
    if (h && h.date === today && (h.issues || []).length) html += `<br><span class="bad">Data check: ${h.issues.slice(0, 2).join('; ')}</span>`;
  } catch (e) { /* the line above is enough */ }
  el.innerHTML = html; el.hidden = false;
}
// Why it says NOTHING so often (3 Nov 2026): the only CALL / PUT is the 09:15 signal on its most confident days. Its
// lean on every other day, scored as if traded: information that builds evidence, not a reason to trade
function whyNothing(sh) {
  const el = $('why');
  el.hidden = !sh || !sh.days;
  if (el.hidden) return;
  const day = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const rs = x => (x >= 0 ? '+₹' : '−₹') + Math.abs(x).toLocaleString('en-IN');
  const pct = x => `${x >= 0 ? '+' : ''}${x.toFixed(2)}%`;
  const t = sh.test;
  el.innerHTML = `<h2>Why NOTHING?</h2>
    <p>Only one tested rule says CALL or PUT: the 09:15 signal, on its most confident days${t && t.trade_share
      ? ` (about 1 day in ${Math.round(1 / t.trade_share)} in its test)` : ''}.
      It has traded <b>${sh.traded} of ${sh.days}</b> days since ${day(sh.since)}.</p>
    <p>Its lean on every day, as if traded from the open to the close: right <b>${sh.right} of ${sh.days}</b>, NIFTY
      <b class="${sh.pct >= 0 ? 'up' : 'down'}">${pct(sh.pct)}</b> after costs${sh.rs != null ? `; an at-the-money option, 1 lot:
      <b class="${sh.rs >= 0 ? 'up' : 'down'}">${rs(sh.rs)}</b> (${sh.rs_days} days on real NSE prices)` : ''}.</p>
    ${t && t.days ? `<p>In its ${t.days}-day test, leaning every day was right ${Math.round(t.right * 100)}% of the time,
      ${pct(t.pct)} a day after costs: a few weeks of this cannot show an edge. Information, not a trade signal.</p>` : ''}
    <table>${sh.rows.slice().reverse().map(x => `<tr><td>${day(x.d)}${x.traded ? ' ★' : ''}</td>
      <td class="${x.dir === 'up' ? 'up' : 'down'}">${x.dir === 'up' ? '▲' : '▼'} ${x.pred != null ? pct(x.pred) : x.dir}</td>
      <td class="n ${x.move_pct >= 0 ? 'up' : 'down'}">${pct(x.move_pct)} ${x.right ? '✓' : '✗'}</td>
      <td class="n ${x.rs == null ? 'm' : x.rs >= 0 ? 'up' : 'down'}">${x.rs == null ? '—' : rs(x.rs)}</td></tr>`).join('')}</table>
    <p style="font-size:12px">Lean · NIFTY open to close · the option on that side, 1 lot (prices come each evening; ★ traded).</p>`;
}
// site-data's newest commit (fresh.js: updated by every 10-minute run, no 5-minute cache); the site copy as a fallback
async function fresh(name) {
  return (await siteFile(name)) || fetch('data/' + name + '?t=' + Date.now(), { cache: 'no-store' });
}
async function loadToday(date) {
  try {
    const r = await fresh('status-today.json');
    const d = r.ok ? await r.json() : null;
    // keep it short, and nothing after the close summary
    const min = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
    const rows = [];
    for (const x of (d && d.date === date ? d.rows : [])) {
      const prev = rows[rows.length - 1];
      if (prev && min(prev.at) >= 15 * 60 + 30) break;
      if (min(x.at) < 8 * 60) continue;                  // the overnight forecast run (02:10): not today's signal yet
      // runs come every 10 minutes: list alerts, changes of state, and otherwise one line per hour
      if (prev && !x.alert && x.state === prev.state && x.at.slice(0, 2) === prev.at.slice(0, 2)) continue;
      rows.push(x);
    }
    $('today').hidden = !rows.length;
    $('rows').innerHTML = rows.map(x => `<li><time>${x.at}</time><b>${x.state}</b><span>${x.price ? x.price.toLocaleString('en-IN') : ''}${
      x.move_pct != null ? ` <span class="${x.move_pct >= 0 ? 'up' : 'down'}">(${x.move_pct >= 0 ? '+' : ''}${x.move_pct.toFixed(2)}%)</span>` : ''}${x.alert ? ' · alert sent' : ''}</span></li>`).join('');
  } catch (e) { $('today').hidden = true; }
}
load();
setInterval(load, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
<script src="nav.js"></script>
</body>
</html>
