<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next 10 minutes</title>
<meta name="theme-color" content="#EDC9AF">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg:#EDC9AF; --text:#2B2F14; --mute:#57532F; --edge:rgba(75,83,32,0.16); --up:#185C3B; --down:#A3261F;
          --warn:#7A4E00; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
               font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { position:fixed; inset:0; display:flex; flex-direction:column;
          padding:calc(env(safe-area-inset-top) + 32px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 10px); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .top b { font-size:19px; letter-spacing:-.01em; } .top small { display:block; color:var(--mute); font-size:12px; }
  .top a { color:var(--text); text-decoration:none; border:1px solid var(--edge); border-radius:999px; padding:5px 12px; font-size:13px; background:rgba(75,83,32,0.1); }
  .now { margin:8px 0 6px; padding:10px 12px; border:1px solid var(--edge); border-radius:12px; background:rgba(75,83,32,0.06); }
  .now .big { font-size:22px; font-weight:700; letter-spacing:-.01em; }
  .warn { color:var(--mute); font-size:12px; margin-top:4px; }
  .warn b { color:var(--warn); font-weight:600; }
  #chart { flex:1; min-height:160px; position:relative; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mute); text-align:center; padding:20px; }
  #msg[hidden] { display:none; }
  #panel { border-top:1px solid var(--edge); padding:8px 2px 0; font-size:13px; max-height:38vh; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; }
  td, th { padding:4px; border-top:1px solid var(--edge); text-align:left; } th { color:var(--mute); font-weight:500; }
  .n { text-align:right; white-space:nowrap; } .m { color:var(--mute); }
  .up { color:var(--up); } .down { color:var(--down); }
  button.show { margin-left:4px; border:1px solid var(--edge); border-radius:999px; padding:3px 10px; font-size:12px;
                color:var(--text); background:rgba(75,83,32,0.1); cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div data-nav><div><b>Next 10 minutes</b><small id="when">Loading…</small></div></div>
    <a href="live.html">Live</a>
  </div>
  <div class="now" id="now" data-glass>…</div>
  <div id="chart"><div id="msg" hidden></div></div>
  <div id="panel" data-glass></div>
</div>
<script src="lightweight-charts.js"></script>
<script src="fresh.js"></script>
<script>
// The model's lean for each next 10-minute candle (scripts/nextcandle.py, written by live.py every 10-minute run), and
// how each lean turned out. Information only: on 11 years it was right 53% of the time and lost money after option
// costs in every year (nextcandle_study.py), so it is never a CALL / PUT signal.
const DELTA = 0.5, COST = 1.85, LOT = 65;      // an at-the-money option moves about half; a round trip ~1.85 option points
const $ = id => document.getElementById(id);
const f = x => x == null ? '' : x.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rs = x => `${x > 0 ? '+' : x < 0 ? '−' : ''}₹${Math.abs(Math.round(x)).toLocaleString('en-IN')}`;
const chart = LightweightCharts.createChart($('chart'), {
  autoSize: true, layout: { background: { color: 'transparent' }, textColor: '#57532F', fontSize: 11 },
  grid: { vertLines: { color: 'rgba(75,83,32,0.06)' }, horzLines: { color: 'rgba(75,83,32,0.08)' } },
  rightPriceScale: { borderColor: 'rgba(75,83,32,0.16)' },
  timeScale: { borderColor: 'rgba(75,83,32,0.16)', timeVisible: true, secondsVisible: false, rightOffset: 4 },
  crosshair: { mode: 0 },
  // 3 Nov 2026: a vertical drag on a phone switched the price axis to a manual zoom (23,000-25,000 for a 200-point day)
  // and it stayed there; the price axis now cannot be dragged, and it re-fits to the candles on every update
  handleScale: { axisPressedMouseMove: { time: true, price: false }, pinch: true, mouseWheel: true },
  handleScroll: { vertTouchDrag: false, pressedMouseMove: true, horzTouchDrag: true, mouseWheel: true },
});
const candles = chart.addCandlestickSeries({ upColor: '#185C3B', downColor: '#A3261F', borderVisible: false,
  wickUpColor: '#185C3B', wickDownColor: '#A3261F' });
let last = '', first = true, data = null;
// The leans are hidden by default (2 Nov 2026): every test says trading them loses after option costs, and an arrow on
// screen invites a trade. The page leads with their live record; "Show today's leans anyway" reveals them for the visit.
let showLeans = false;
try { showLeans = sessionStorage.getItem('showLeans') === '1'; } catch (e) {}

function epoch(date, hm) { return Date.parse(`${date}T${hm}:00Z`) / 1000; }   // chart times: IST clock as UTC

// A lean is scored only once its candle has finished: a later candle exists, the data was written 10+ minutes after
// the candle started, or the market has closed. (The run writes a minute or two into each new candle, so the newest
// candle in the file is usually still forming: scoring it then judged the lean on its first minute.)
// no lean after the 15:15 candle (15:25 is a 5-minute stub); since NSE's closing auction (3 Aug 2026) NIFTY cannot
// move from 15:15, so the last lean is for 15:05 (nextcandle.last_full) and older 15:15 leans are not scored
const lastLean = d => d.date >= '2026-08-03' ? '15:05' : '15:15';
function score(d) {
  const c = d.candles || [], byT = new Map(c.map((x, i) => [x.time, i]));
  const asOf = d.updated ? epoch(d.date, d.updated.slice(11, 16)) : 0;
  return (d.leans || []).filter(l => l.at <= lastLean(d)).map(l => {
    const t = epoch(d.date, l.at), i = byT.get(t);
    const finished = i != null && (i < c.length - 1 || asOf >= t + 600 || d.status === 'closed');
    if (i == null || i === 0 || !finished) return { ...l, t, pending: true };
    if (c[i].paused) return { ...l, t, paused: true };      // the price feed paused: not a price, not scored (live.py)
    const move = c[i].close - c[i - 1].close, side = l.lean === 'up' ? 1 : -1;
    return { ...l, t, move, right: Math.sign(move) === side, rs: (DELTA * side * move - COST) * LOT };
  });
}

function recordHTML(d) {
  const r = d.live_record, t = d.day_record;
  const day = x => new Date(x + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const live = r
    ? `<div class="m">Trading every lean, 1 lot, since ${day(r.since)}</div><div class="big ${r.rs >= 0 ? 'up' : 'down'}">${rs(r.rs)}</div>
       <div>Lost money on ${r.losing_days} of ${r.days} day${r.days > 1 ? 's' : ''}; ${r.right} of ${r.leans} leans right (${Math.round(r.right / r.leans * 100)}%).</div>`
    : '<div class="big m" style="font-size:16px">No finished day yet</div>';
  const test = t ? `<div class="m">9-year test (${t.from.slice(0, 4)}-${t.to.slice(0, 4)}): lost money on ${Math.round((1 - t.profit_share) * 10)} of 10 days, ${rs(t.avg_rs)} a day on average.</div>` : '';
  return live + test + paperLine(d) + starCard(d) + `<div class="warn"><b>Not a CALL / PUT signal.</b> The leans lose after option costs, so they are hidden.
    <button class="show" data-show="1" data-switch="off">Show today's leans anyway</button></div>`;
}

function draw(d) {
  data = d;
  const c = d.candles || [], s = score(d), done = s.filter(x => !x.pending && !x.paused), cur = s[s.length - 1];
  $('msg').hidden = c.length > 0;
  $('msg').textContent = c.length ? '' : "Today's candles start after the 09:15 open.";
  candles.setData(c);
  chart.priceScale('right').applyOptions({ autoScale: true });
  candles.setMarkers(!showLeans ? [] : s.map(x => ({ time: x.t, position: x.lean === 'up' ? 'belowBar' : 'aboveBar',
    shape: x.lean === 'up' ? 'arrowUp' : 'arrowDown', color: x.pending || x.paused ? '#57532F' : x.right ? '#185C3B' : '#A3261F',
    text: x.confident ? '★' : '' })).sort((a, b) => a.time - b.time));
  if (first && c.length) { chart.timeScale().fitContent(); first = false; }
  $('when').innerHTML = `Updated ${(d.updated || '').slice(11, 16)} IST · ${d.status === 'open' ? `${freshTag(d.updated, true)} · ${nextRun(d.updated)}${d.feed === 'kite' ? ' · Kite prices' : ''}` : d.status === 'closed' ? 'market closed' : 'before the open'}`;
  const rec = (d.record && d.record.text) || 'not tested';
  const nowIST = Date.now() / 1000 + 19800, late = cur && d.status === 'open' && nowIST >= cur.t + 600 + 120;
  const lastAt = lastLean(d), over = cur && cur.at >= lastAt;
  // 5 Nov 2026: with the leans on, the direction comes first (as before the size forecast), the size one line under it
  $('now').innerHTML = (showLeans ? '' : sizeLine(cur, d, late)) + (!showLeans ? recordHTML(d) : (late && over
      ? `<div class="big m" style="font-size:16px">No more leans today</div><div class="m">${lastAt === '15:05' ? "NSE's closing auction holds NIFTY still from 15:15 until the close is set at 15:30, so the last lean is for 15:05 to 15:15." : 'The last 10-minute candle is 15:15 to 15:25.'}</div>`
      : late
      ? `<div class="big m" style="font-size:16px">Waiting for the ${addMin(cur.at, 10)} update</div>
         <div class="m">It runs every 10 minutes, but GitHub sometimes starts it a few minutes late. The page refreshes by itself.</div>`
      : cur && cur.pending && d.status === 'open'
      ? `<div class="m">${cur.at} to ${addMin(cur.at, 10)}</div><div class="big ${cur.lean === 'up' ? 'up' : 'down'}">${cur.lean === 'up' ? '▲ leans up' : '▼ leans down'}
         <span style="font-size:14px;font-weight:500">${Math.abs(cur.pts) < 0.05 ? '≈0 pts: a coin flip' : `${cur.pts >= 0 ? '+' : ''}${cur.pts} pts`}${cur.confident ? ' · ★ more confident' : ''}</span></div>`
        + sizeShort(cur)
      : `<div class="big m" style="font-size:16px">${d.status === 'open' ? 'Waiting for the next 10-minute candle' : 'No live lean (market closed)'}</div>`)
    + (showLeans ? `<div class="warn"><b>Information, not a CALL / PUT signal.</b> ${rec}. <button class="show" data-show="0" data-switch="on">Show the leans</button></div>` : ''));
  const right = done.filter(x => x.right).length, money = done.reduce((a, x) => a + x.rs, 0);
  const conf = done.filter(x => x.confident), cRight = conf.filter(x => x.right).length;
  // each lean's ₹ on Kite's real option prices once the close has scored the day (paper_accounts.py), else the estimate
  const pd = paper && paper.days && paper.days.length && paper.days[paper.days.length - 1].d === d.date ? paper.today_leans || [] : [];
  const real = Object.fromEntries(pd.map(x => [x.at + x.lean, x.rs]));
  $('panel').innerHTML = dayKind(c) + (done.length
      ? `<div><b>Today: ${right} of ${done.length} right (${Math.round(right / done.length * 100)}%)</b>`
        + (conf.length ? ` · ★ more confident: ${cRight} of ${conf.length}` : '')
        + `. Trading every lean with 1 lot of an at-the-money option: <b class="${money >= 0 ? 'up' : 'down'}">${rs(money)}</b> after costs.</div>`
        + dayLine(money, d) + (showLeans ? paperLine(d) + starCard(d) : '')
      : '<div class="m">No lean scored yet today.</div>')
    + (showLeans && s.length ? `<table><tr><th>Candle</th><th>Lean</th><th class="n">Actual</th><th class="n">1 lot</th></tr>`
        + s.slice().reverse().map(x => `<tr><td>${x.at}${x.confident ? ' ★' : ''}</td><td class="${x.lean === 'up' ? 'up' : 'down'}">${x.lean} ${x.pts >= 0 ? '+' : ''}${x.pts}${x.size != null ? ` <span class="m">±${x.size}</span>` : ''}</td>`
          + (x.pending ? `<td class="n m">${d.status === 'open' ? 'pending' : 'not scored'}</td><td></td>` : x.paused ? '<td class="n m">feed paused</td><td></td>' : `<td class="n ${x.right ? 'up' : 'down'}">${x.move >= 0 ? '+' : ''}${x.move.toFixed(1)} ${x.right ? '✓' : '✗'}</td><td class="n ${(real[x.at + x.lean] ?? x.rs) >= 0 ? 'up' : 'down'}">${rs(real[x.at + x.lean] ?? x.rs)}${real[x.at + x.lean] != null ? '•' : ''}</td>`)
          + '</tr>').join('') + '</table>' : '')
    + (d.paused_from ? `<div class="m" style="margin-top:6px">Yahoo's price feed paused from ${d.paused_from}; those candles are left out and their leans are not scored.</div>` : '')
    + (!showLeans ? '' : `<div class="m" style="margin-top:6px">Arrows: the lean for that candle (green right, red wrong, grey pending; ★ a top-20% call).
       ₹ per lot: with • on Kite's real option prices (bought at the at-the-money option's price when the lean was made, sold 10 minutes later), added after the close; without •, assuming the option moves half as much as NIFTY. A round trip costs about ₹120.${d.trained_until ? ` Model trained on candles to ${d.trained_until}.` : ''}</div>`);
}

// The day so far (10 Nov 2026): "trending" when NIFTY's move since the open is 40%+ of the distance it has travelled
// in 10-minute steps, from 3 candles on (leanfilter_study's F3, here in points). A description of the day, not a
// signal: leans taken with a trending day still lost in the test (-Rs99 a lot a trade, 0 of 10 years).
function dayKind(c) {
  if (c.length < 3) return '';
  const net = c[c.length - 1].close - c[0].open;
  const path = c.reduce((a, x, i) => a + Math.abs(x.close - (i ? c[i - 1].close : x.open)), 0);
  const trend = path > 0 && Math.abs(net) / path >= 0.4;
  return `<div style="margin-bottom:6px">Day so far: <b class="${!trend ? '' : net > 0 ? 'up' : 'down'}">${!trend ? 'Choppy' : net > 0 ? 'Trending up' : 'Trending down'}</b>
    <span class="m">· ${net >= 0 ? '+' : ''}${Math.round(net)} pts since the open, out of ${Math.round(path)} pts travelled. Describes the day; it did not make the leans pay in the test.</span></div>`;
}

// Paper accounts on Kite's real option prices (5 Nov 2026, paper_accounts.py, at the close): each lean bought at its
// at-the-money option's real price when it was made and sold at the next run's, instead of the half-delta estimate above
function paperLine(d) {
  const p = paper;
  if (!p || !p.totals || !p.totals.leans) return '';
  const a = p.totals.leans, s = p.totals.leans_star, day = (p.days || []).find(x => x.d === d.date);
  const t = day && day.accounts.leans, ts = day && day.accounts.leans_star;
  const g = p.totals.signal_lean;       // the 09:15 signal's lean, at-the-money option on its side, open to close
  return `<div class="m" style="margin-top:6px"><b style="color:var(--text)">On real option prices</b> (Kite quotes, ₹2 lakh paper from ${new Date(p.start + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' })}):
    every lean <b class="${a.rs >= 0 ? 'up' : 'down'}">${rs(a.rs)}</b> in ${a.days} day${a.days > 1 ? 's' : ''}${s ? `, ★ leans only <b class="${s.rs >= 0 ? 'up' : 'down'}">${rs(s.rs)}</b>` : ''}.
    ${t ? `Today: every lean <b class="${t.rs >= 0 ? 'up' : 'down'}">${rs(t.rs)}</b> (${t.won} of ${t.trades} made money)${ts && ts.trades ? `, ★ <b class="${ts.rs >= 0 ? 'up' : 'down'}">${rs(ts.rs)}</b> (${ts.won} of ${ts.trades})` : ''}.` : 'Today is added after the close.'}
    ${g && g.days ? `The 09:15 signal's lean, open to close: right on ${g.won} of ${g.days} day${g.days > 1 ? 's' : ''}, <b style="white-space:nowrap" class="${g.rs >= 0 ? 'up' : 'down'}">${rs(g.rs)}</b>.` : ''}</div>`;
}

// The ★ report card (11 Nov 2026): the ★ leans alone, day by day, the leans the owner trades. Right / total and
// NIFTY points caught the right way (live.next_record), and ₹ a lot on Kite's real option prices where the paper
// account scored that day (paper_accounts.py). Beside the 9-year test, so a good run reads against it.
function starCard(d) {
  const r = d.live_record, s = r && r.star;
  if (!s) return '';
  const paid = Object.fromEntries(((paper && paper.days) || []).map(x => [x.d, x.accounts.leans_star]));
  const day = x => new Date(x + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const rows = (r.by_day || []).filter(x => x.star).slice(-7).reverse().map(x => {
    const p = paid[x.d];
    return `<tr><td>${day(x.d)}</td><td class="n">${x.star.right} of ${x.star.leans}</td><td class="n ${x.star.pts >= 0 ? 'up' : 'down'}">${x.star.pts >= 0 ? '+' : ''}${x.star.pts}</td>`
      + `<td class="n ${p ? (p.rs >= 0 ? 'up' : 'down') : 'm'}">${p ? rs(p.rs) : '—'}</td></tr>`;
  }).join('');
  return `<div style="margin-top:10px"><b style="color:var(--text)">★ report card</b> <span class="m">(the leans traded for real)</span>
    <div>Since ${day(r.since)}: <b>${s.right} of ${s.leans} right (${Math.round(s.right / s.leans * 100)}%)</b>,
      <b class="${s.pts >= 0 ? 'up' : 'down'}">${s.pts >= 0 ? '+' : ''}${s.pts} pts</b> the right way, up on ${s.up_days} of ${s.days} days.
      <span class="m">The 9-year test: right 53%, −₹72 a lot a trade after costs.</span></div>
    <table><tr><th>Day</th><th class="n">★ right</th><th class="n">pts</th><th class="n">₹ real prices</th></tr>${rows}</table></div>`;
}

// The expected size of the next move (5 Nov 2026, movesize_study.py): it passed its test (error 10% below the usual
// size at that time of day, in all 10 years), unlike the direction; shown whether the leans are on or off
function sizeShort(cur) {
  if (cur.size == null) return '';
  const big = cur.typical ? cur.size / cur.typical : 1;
  const word = big >= 1.3 ? 'bigger than usual' : big <= 0.75 ? 'smaller than usual' : 'about usual';
  return `<div class="m" style="font-size:13px;margin-top:2px">Expected size of this move: <b style="color:var(--text)">±${cur.size} pts</b>, ${word}${cur.typical ? ` (usual ±${cur.typical})` : ''}. The size is tested; the direction is not.</div>`;
}
function sizeLine(cur, d, late) {
  if (!cur || !cur.pending || d.status !== 'open' || late || cur.size == null) return '';
  const big = cur.typical ? cur.size / cur.typical : 1;
  const word = big >= 1.3 ? 'bigger than usual' : big <= 0.75 ? 'smaller than usual' : 'about usual';
  return `${showLeans ? '' : `<div class="m">${cur.at} to ${addMin(cur.at, 10)}</div>`}
    <div class="big" style="font-size:22px">±${cur.size} pts <span style="font-size:14px;font-weight:500" class="m">expected size, ${word}${cur.typical ? ` (usual ±${cur.typical})` : ''}</span></div>
    <div class="m" style="font-size:13px;margin-bottom:8px">Size, not direction. An at-the-money option needs about 7.4 points the right way to cover a round trip's costs.
    Tested 2017-2026: 10% closer than the usual size at that time of day, in every year.</div>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button.show');
  if (!b) return;
  showLeans = b.dataset.show === '1';
  try { sessionStorage.setItem('showLeans', showLeans ? '1' : '0'); } catch (err) {}
  if (data) draw(data);
});

// The 9-year record of trading every lean, day by day (nextcandle_study.day_record): most days lose, so a day's score
// is shown with it, and after the close with where the day ranks among those days.
function dayLine(money, d) {
  const r = d.day_record;
  if (!r) return '';
  const y0 = r.from.slice(0, 4), y1 = r.to.slice(0, 4);
  let txt = `In ${y0}-${y1} trading every lean lost money on <b>${Math.round((1 - r.profit_share) * 10)} of 10 days</b>
    (${rs(r.avg_rs)} a day on average, ${r.days.toLocaleString('en-IN')} days).`;
  if (d.status === 'closed') {
    const q = Object.entries(r.quantiles).map(([k, v]) => [Number(k), v]).sort((a, b) => a[0] - b[0]);
    let pct = money <= q[0][1] ? q[0][0] : money >= q[q.length - 1][1] ? q[q.length - 1][0] : null;
    for (let i = 1; pct == null && i < q.length; i++)
      if (money <= q[i][1]) pct = q[i - 1][0] + (q[i][0] - q[i - 1][0]) * (money - q[i - 1][1]) / (q[i][1] - q[i - 1][1]);
    txt += pct < 50 ? ` Today was worse than ${Math.round(100 - pct)}% of those days.` : ` Today was better than ${Math.round(pct)}% of them.`;
  }
  return `<div class="m" style="margin-top:4px">${txt}</div>`;
}

function addMin(hm, m) { const [h, mm] = hm.split(':').map(Number), t = h * 60 + mm + m; return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; }

let paper = null;
async function load() {
  let d = null, p = null;
  [d, p] = await Promise.all([siteJSON('next-nifty.json'), siteJSON('paper-accounts.json')].map(x => x.catch(() => null)));   // fresh.js: site-data's newest commit
  if (!d) { $('msg').hidden = false; $('msg').textContent = 'No data yet today.'; return; }
  const key = d.updated + (p && p.updated);
  paper = p;
  if (key !== last) { last = key; draw(d); }
}
load();
setInterval(load, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
<script src="nav.js"></script>
</body>
</html>
