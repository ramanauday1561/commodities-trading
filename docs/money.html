<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money</title>
<meta name="theme-color" content="#EDC9AF">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Money (11 Nov 2026, asked by the user): only the money in the Kite account, up or down, from Kite itself through
     the order server (/api/money: funds, the day's P&L, Kite's charges for the day's orders). Uses the server address
     and passcode saved by the Orders page. Nothing here is saved in the repository; the server keeps one row of
     totals a day (never positions). -->
<style>
  :root { --bg:#EDC9AF; --card:#F7E8D8; --line:rgba(75,83,32,.25); --text:#2B2F14; --muted:#57532F; --up:#185C3B; --down:#A3261F; --warn:#7A4E00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width:560px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  header b { font-size:22px; } header small { display:block; color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:10px 0; }
  .card h2 { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:600; }
  .up { color:var(--up); } .down { color:var(--down); } .m { color:var(--muted); } .warn { color:var(--warn); }
  .big { font-size:40px; font-weight:800; letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid rgba(75,83,32,.15); }
  .row:first-of-type { border-top:0; } .row span:first-child { color:var(--muted); }
  .row b { font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
  .bars { display:flex; gap:3px; height:96px; margin:8px 0 4px; background:linear-gradient(var(--line), var(--line)) 0 50% / 100% 1px no-repeat; }
  .bars i { flex:1; min-width:4px; position:relative; }
  .bars i b { position:absolute; left:0; right:0; border-radius:2px; }
  .note { font-size:12px; color:var(--muted); margin-top:6px; }
  .err { color:var(--down); font-size:14px; overflow-wrap:anywhere; }
  a { color:var(--text); }
</style>
<script src="fresh.js"></script>
</head>
<body>
<main>
  <header data-nav><div><b>Money</b><small id="when">From your Kite account</small></div></header>
  <section class="card" id="today"><div class="m">Loading…</div></section>
  <section class="card" id="parts" hidden></section>
  <section class="card" id="days" hidden></section>
  <p class="note">Real money, from Kite through your order server. Charges are Kite's own calculation (brokerage, STT, exchange and
    SEBI fees, stamp duty, GST). The server keeps one line of totals a day; nothing goes into the app's repository.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const rs = x => `${x > 0 ? '+' : x < 0 ? '−' : ''}₹${Math.abs(Math.round(x)).toLocaleString('en-IN')}`;
const k0 = x => '₹' + Math.round(x).toLocaleString('en-IN');
const cls = x => x > 0 ? 'up' : x < 0 ? 'down' : '';
const day = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const srv = get('ordersUrl'), code = get('ordersCode');

function draw(m) {
  const t = m.today, pct = t.start ? t.net / t.start * 100 : 0;
  $('today').innerHTML = `<h2>Today, after charges</h2>
    <div class="big ${cls(t.net)}">${rs(t.net)}</div>
    <div class="m">${t.start ? `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% of the ${k0(t.start)} you started with` : 'No opening balance from Kite yet'}</div>`;
  $('parts').hidden = false;
  $('parts').innerHTML = `<h2>How it adds up</h2>
    <div class="row"><span>Started the day with</span><b>${k0(t.start)}</b></div>
    <div class="row"><span>Trades made or lost</span><b class="${cls(t.pnl)}">${rs(t.pnl)}</b></div>
    <div class="row"><span>Charges (${t.orders} order${t.orders === 1 ? '' : 's'})</span><b class="${t.charges ? 'down' : ''}">${rs(-t.charges)}</b></div>
    <div class="row"><span><b style="color:var(--text)">Now</b></span><b>${k0(t.now)}</b></div>
    <div class="row"><span>Free to trade in Kite</span><b>${k0(m.free_to_trade)}</b></div>
    ${m.charges && m.charges.source === 'estimate' ? '<div class="note warn">Kite did not give the charges just now: about ₹120 a round trip is used.</div>' : ''}`;
  const h = (m.history || []).filter(x => x.orders || x.d === m.day), tot = h.reduce((a, x) => a + x.net, 0);
  if (!h.length) return;
  const max = Math.max(...h.map(x => Math.abs(x.net)), 1);
  $('days').hidden = false;
  $('days').innerHTML = `<h2>Every trading day</h2>
    <div class="row"><span>Total since ${day(h[0].d)}</span><b class="${cls(tot)}">${rs(tot)}</b></div>
    <div class="row"><span>Days up / down</span><b>${h.filter(x => x.net > 0).length} up · ${h.filter(x => x.net < 0).length} down</b></div>
    <div class="bars" role="img" aria-label="Each day's result after charges">${h.slice(-30).map(x =>        // up days grow up from the middle line, down days down
      `<i title="${day(x.d)}: ${rs(x.net)}"><b style="height:${Math.max(2, Math.abs(x.net) / max * 50)}%;${x.net >= 0 ? 'bottom' : 'top'}:50%;background:var(--${x.net >= 0 ? 'up' : 'down'})"></b></i>`).join('')}</div>
    ${h.slice().reverse().slice(0, 15).map(x => `<div class="row"><span>${day(x.d)}</span><b class="${cls(x.net)}">${rs(x.net)}</b></div>`).join('')}`;
}

async function load() {
  if (document.hidden) return;
  if (!srv || !code) {
    $('today').innerHTML = '<div class="m">Connect your order server on the <a href="orders.html">Orders</a> page first; this page uses the same address and passcode.</div>';
    return;
  }
  try {
    const r = await fetch(srv.replace(/\/+$/, '') + '/api/money', { cache: 'no-store', headers: { Authorization: 'Bearer ' + code } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `server answered ${r.status}`);
    draw(j);
    $('when').textContent = `Updated ${(j.now || '').slice(11, 16)} IST · from Kite`;
  } catch (e) {
    $('today').innerHTML = `<div class="err">${String(e.message).replace(/[&<>]/g, '')}</div>
      <div class="note">${/Kite login/.test(e.message) ? 'Log in on the <a href="kite.html">Kite login</a> page; this page follows within a minute.' : 'Is the order server running? Check the Orders page.'}</div>`;
  }
}
load();
setInterval(load, 30000);
document.addEventListener('visibilitychange', load);
</script>
<script src="nav.js"></script>
</body>
</html>
